[workspace]
resolver = "2"
members = ["crates/gantry-server", "crates/gantry-mcp"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/gantry"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1
