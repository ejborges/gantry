# nginx as the load balancer in front of several Gantry application nodes.
# Install as /etc/nginx/conf.d/gantry.conf on the balancer.

upstream gantry_nodes {
    least_conn;
    server 10.0.0.21:8600 max_fails=2 fail_timeout=10s;
    server 10.0.0.22:8600 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name gantry.example.org;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                               # nginx 1.25.1 or newer; on older releases use "listen 443 ssl http2;"
    server_name gantry.example.org;

    ssl_certificate     /etc/pki/tls/certs/gantry.example.org.fullchain.pem;
    ssl_certificate_key /etc/pki/tls/private/gantry.example.org.key;
    ssl_session_cache   shared:gantry:10m;
    ssl_session_tickets off;
    # Gantry itself sends Strict-Transport-Security and the other security headers.

    client_max_body_size 26m;               # server.max_body_mb + 1

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    120s;
    proxy_request_buffering off;
    # A node that is restarting or not ready is skipped; safe requests are retried elsewhere.
    proxy_next_upstream error timeout http_502 http_503;

    location = /metrics { return 404; }     # scrape each node directly instead

    # Live updates and shared editing use one long-lived WebSocket per browser tab. Any node
    # can take it: the nodes pass events to each other through the database.
    location = /api/v1/ws {
        proxy_pass http://gantry_nodes;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Shown while no node answers. Copy unavailable.html from a node (/usr/share/gantry/web/)
    # to the balancer, and add your support contact to it if you like.
    error_page 502 503 504 /unavailable.html;
    location = /unavailable.html { root /usr/share/nginx/gantry; internal; }

    location / { proxy_pass http://gantry_nodes; }
}

# Open-source nginx checks health passively (max_fails above). For active checks against
# /readyz use HAProxy ("option httpchk GET /readyz") or a cloud load balancer's health probe.
